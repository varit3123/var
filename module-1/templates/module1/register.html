{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Водить.РФ | Регистрация</title>
  <link rel="stylesheet" href="{% static 'module1/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'module1:login' %}">
      <span>Водить.РФ</span>
    </a>
    <nav class="top-nav" aria-label="Основная навигация">
      <a href="{% url 'module1:login' %}">Вход</a>
      <a href="{% url 'module1:register' %}" class="active">Регистрация</a>
      <a href="{% url 'module1:admin' %}">Администратор</a>
    </nav>
  </header>

  <main class="page-shell narrow">
    <section class="form-panel wide" aria-labelledby="register-title">
      <p class="eyebrow">Новый пользователь</p>
      <h1 id="register-title">Регистрация</h1>
      <form method="post" class="grid-form" novalidate>
        {% csrf_token %}
        <label>
          ФИО
          {{ form.full_name }}
          <span class="field-error">{{ form.full_name.errors|striptags }}</span>
        </label>
        <label>
          Дата рождения
          {{ form.birth_date }}
          <span class="field-error">{{ form.birth_date.errors|striptags }}</span>
        </label>
        <label>
          Телефон
          {{ form.phone }}
          <span class="field-error">{{ form.phone.errors|striptags }}</span>
        </label>
        <label>
          E-mail
          {{ form.email }}
          <span class="field-error">{{ form.email.errors|striptags }}</span>
        </label>
        <label>
          Логин
          {{ form.login }}
          <span class="hint">Минимум 6 символов: латинские буквы и цифры.</span>
          <span class="field-error">{{ form.login.errors|striptags }}</span>
        </label>
        <label>
          Пароль
          {{ form.password }}
          <span class="hint">Не менее 8 символов.</span>
          <span class="field-error">{{ form.password.errors|striptags }}</span>
        </label>
        <p class="form-message">{{ form.non_field_errors|striptags }}</p>
        <button class="button primary" type="submit">Создать аккаунт</button>
      </form>
      <p class="switch-link">Уже есть аккаунт? <a href="{% url 'module1:login' %}">Войти</a></p>
    </section>
  </main>
</body>
</html>
