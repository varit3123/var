{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Водить.РФ | Новая заявка</title>
  <link rel="stylesheet" href="{% static 'module2/styles.css' %}">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="{% url 'module2:cabinet' %}">
      <img src="{% static 'module2/assets/boat.png' %}" alt="">
      <span>Водить.РФ</span>
    </a>
    <nav class="nav" aria-label="Основная навигация">
      <a href="{% url 'module2:cabinet' %}">Кабинет</a>
      <a class="active" href="{% url 'module2:request' %}">Заявка</a>
      <a href="{% url 'module2:logout' %}">Выйти</a>
    </nav>
  </header>

  <main class="page">
    <section class="form-surface" aria-labelledby="request-title">
      <p class="eyebrow">Курс обучения</p>
      <h1 id="request-title">Новая заявка</h1>
      <form method="post" class="form-grid" novalidate>
        {% csrf_token %}
        <label>
          Вид транспорта
          {{ form.transport }}
          <span class="field-error">{{ form.transport.errors|striptags }}</span>
        </label>
        <label>
          Дата начала
          {{ form.start_date }}
          <span class="field-error">{{ form.start_date.errors|striptags }}</span>
        </label>
        <label>
          Способ оплаты
          {{ form.payment_method }}
          <span class="field-error">{{ form.payment_method.errors|striptags }}</span>
        </label>
        <label class="full">
          Комментарий
          {{ form.comment }}
        </label>
        <p class="form-message full">{{ form.non_field_errors|striptags }}</p>
        <button class="button primary full" type="submit">Отправить заявку</button>
      </form>
    </section>
  </main>

  <script src="{% static 'module2/app.js' %}"></script>
</body>
</html>
